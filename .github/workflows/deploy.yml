name: Deploy to GitHub Pages

on:
  push:
    branches: [v6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # flips the repo's Pages source from legacy branch-deploy to GitHub Actions
      # on first run, so no manual settings step is needed
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
